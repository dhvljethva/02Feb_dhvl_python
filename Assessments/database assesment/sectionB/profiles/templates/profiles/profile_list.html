<!DOCTYPE html>
<html>
<head>
    <title>All Profiles</title>
</head>
<body>
    <h1>User Profiles</h1>

    <!-- Task 4 — DTL loop to display each profile's username and age -->
    <ul>
        {% for profile in profiles %}
            <li>{{ profile.username }} — Age: {{ profile.age }}</li>
        {% empty %}
            <li>No profiles found.</li>
        {% endfor %}
    </ul>

    <br>
    <a href="{% url 'create_profile' %}">Add New Profile</a>
</body>
</html>
